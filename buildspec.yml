version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin 108782080376.dkr.ecr.eu-west-1.amazonaws.com
      - export REPO_URI=108782080376.dkr.ecr.eu-west-1.amazonaws.com/site-visit-backend
      - export IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - docker build -t site-visit-backend -f dockerfile .
      - docker tag site-visit-backend:latest $REPO_URI:$IMAGE_TAG
      - docker tag site-visit-backend:latest $REPO_URI:latest
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker images to ECR...
      - docker push $REPO_URI:$IMAGE_TAG
      - docker push $REPO_URI:latest
      - echo Writing image definitions file...
      - echo '[{"name":"EC-Power-SiteVisit-Backend-Prod-Cont","imageUri":"'"$REPO_URI:$IMAGE_TAG"'"}]' > imagedefinitions.json
      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
    - appspec.yaml
    - taskdef.json
