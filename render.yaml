# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: site-visit-companion-backend
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev && npm run build && npx playwright install chromium
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: FRONTEND_URL
        sync: false